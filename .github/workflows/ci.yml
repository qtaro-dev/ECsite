name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-e2e:
    name: Catalog UI browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up local Supabase
        uses: supabase/setup-cli@adc7f6c42cdd496c1c01bd3d49bd1c9f7da9630d # main as of 2026-09-24
        with:
          version: 2.117.0

      - name: Start and seed local Supabase
        run: |
          supabase start
          supabase db reset --local
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t15-e2e-fixtures.sql

      - name: Export local Supabase credentials
        run: |
          supabase status --output json | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.ANON_KEY)\nSUPABASE_URL=\(.API_URL)\nSUPABASE_ANON_KEY=\(.ANON_KEY)\nSUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)\nJWT_SECRET=\(.JWT_SECRET)"' >> "$GITHUB_ENV"
          echo 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
          echo 'SUPABASE_INBUCKET_URL=http://127.0.0.1:54324' >> "$GITHUB_ENV"

      - name: Upload published and hidden image fixtures
        run: |
          python3 tests/database/t11-storage-fixtures.py
          python3 tests/database/t15-storage-fixtures.py

      - name: Create isolated T36 browser accounts
        run: node tests/e2e/t36-create-users.mjs

      - name: Grant the T36 admin fixture and verify the regular member stays unprivileged
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t36-admin-fixtures.sql

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run catalog, authentication, member address, and admin browser tests
        run: npx playwright test tests/e2e/t14-catalog-explorer.spec.ts tests/e2e/t15-product-detail.spec.ts tests/e2e/t17-email-auth.spec.ts tests/e2e/t21-member-address.spec.ts tests/e2e/t36-admin-auth.spec.ts tests/e2e/t40-admin-shipping.spec.ts

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint OpenAPI
        run: npm run lint:openapi

      - name: Build
        run: npm run build
