name: T06 database integration

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/database/t06-member-product-schema.sql'
      - '.github/workflows/t06-db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/database/t06-member-product-schema.sql'
      - '.github/workflows/t06-db.yml'

permissions:
  contents: read

jobs:
  t06-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@adc7f6c42cdd496c1c01bd3d49bd1c9f7da9630d # main as of 2026-09-24
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start --debug
      - name: Apply migrations from a clean database
        run: supabase db reset --local
      - name: Check T06 constraints and indexes
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t06-member-product-schema.sql
