name: Database integration

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/database/t06-member-product-schema.sql'
      - 'tests/database/t07-inventory-order-payment.sql'
      - 'tests/database/t08-settings-notification-audit.sql'
      - 'tests/database/t09-public-storage-rls.sql'
      - 'tests/database/t09-storage-http.py'
      - 'tests/database/t10-member-admin-rls.sql'
      - 'tests/database/t11-test-data.sql'
      - 'tests/database/t11-storage-fixtures.py'
      - 'tests/database/t13-product-search.sql'
      - 'tests/database/t15-product-detail.sql'
      - 'tests/database/t16-catalog-exceptions.sql'
      - 'tests/database/t25-cart-api.sql'
      - 'tests/database/t40-admin-shipping-settings.sql'
      - '.github/workflows/t06-db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/database/t06-member-product-schema.sql'
      - 'tests/database/t07-inventory-order-payment.sql'
      - 'tests/database/t08-settings-notification-audit.sql'
      - 'tests/database/t09-public-storage-rls.sql'
      - 'tests/database/t09-storage-http.py'
      - 'tests/database/t10-member-admin-rls.sql'
      - 'tests/database/t11-test-data.sql'
      - 'tests/database/t11-storage-fixtures.py'
      - 'tests/database/t13-product-search.sql'
      - 'tests/database/t15-product-detail.sql'
      - 'tests/database/t16-catalog-exceptions.sql'
      - 'tests/database/t25-cart-api.sql'
      - 'tests/database/t40-admin-shipping-settings.sql'
      - '.github/workflows/t06-db.yml'

permissions:
  contents: read

jobs:
  t06-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@adc7f6c42cdd496c1c01bd3d49bd1c9f7da9630d # main as of 2026-09-24
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start --debug
      - name: Apply migrations from a clean database
        run: supabase db reset --local
      - name: Check T06 constraints and indexes
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t06-member-product-schema.sql
      - name: Check T07 inventory, order, and payment schema
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t07-inventory-order-payment.sql
      - name: Check T08 settings, notification, and audit schema
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t08-settings-notification-audit.sql

      - name: Check T09 catalog and Storage RLS
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t09-public-storage-rls.sql
      - name: Check T10 member and administrator RLS
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t10-member-admin-rls.sql
      - name: Reapply seed and check T11 fixture cases
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/seed.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t11-test-data.sql
      - name: Check T13 public product search, stable paging, and RLS
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t13-product-search.sql
      - name: Check T15 product detail publish boundary and availability
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t15-product-detail.sql
      - name: Check T16 catalog exceptions, publication updates, and public boundary
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t16-catalog-exceptions.sql
      - name: Check T25 anonymous/member cart RPC ownership and stock bounds
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t25-cart-api.sql
      - name: Check T40 shipping settings versions, validation, and audit
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file tests/database/t40-admin-shipping-settings.sql
      - name: Export local Supabase API credentials
        run: supabase status --output json | jq -r '"SUPABASE_URL=\(.API_URL)\nSUPABASE_ANON_KEY=\(.ANON_KEY)\nSUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)\nJWT_SECRET=\(.JWT_SECRET)"' >> "$GITHUB_ENV"
      - name: Upload and read T11 image placeholders
        run: python3 tests/database/t11-storage-fixtures.py
      - name: Check T09 private Storage URLs
        run: python3 tests/database/t09-storage-http.py
